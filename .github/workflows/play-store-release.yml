name: Build Nutrolix Customer Play Store AAB and APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Customer app version name"
        required: true
        default: "1.0"
        type: string
      version_code:
        description: "Customer app version code (must increase for every upload)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-customer-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK build tools for APK signature verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android sdkmanager was not found on the runner."
              exit 1
            fi
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;36.0.0"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate and restore Play upload credentials
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          for name in UPLOAD_KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing or empty GitHub Actions secret: $name"
              exit 1
            fi
          done

          echo "Checking Base64 keystore secret..."
          if ! printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/nutrolix-upload-key.jks"; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not valid Base64. Recreate this secret from the supplied TXT file."
            exit 1
          fi
          test -s "$RUNNER_TEMP/nutrolix-upload-key.jks" || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "Keystore Base64 decoded successfully."

          echo "Checking Firebase JSON secret..."
          if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not valid Base64. Recreate this secret from the supplied TXT file."
            exit 1
          fi
          test -s app/google-services.json || { echo "::error::Decoded Firebase JSON is empty"; exit 1; }
          echo "Firebase JSON Base64 decoded successfully."

          echo "Checking keystore password and alias..."
          if ! keytool -list -keystore "$RUNNER_TEMP/nutrolix-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened with STORE_PASSWORD and KEY_ALIAS. Check those two GitHub secrets."
            exit 1
          fi
          echo "Keystore password and alias verified."

          echo "Checking Firebase package name..."
          if ! jq -e '[.client[].client_info.android_client_info.package_name] | index("com.aistudio.nutrolix.fooddelivery") != null' app/google-services.json >/dev/null 2>&1; then
            echo "::error::Firebase JSON is invalid or does not contain package com.aistudio.nutrolix.fooddelivery."
            exit 1
          fi
          echo "Firebase package name verified."
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nutrolix-upload-key.jks" >> "$GITHUB_ENV"

      - name: Validate version inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code must be a positive integer"; exit 1; }
          [[ -n "$VERSION_NAME" ]] || { echo "::error::version_name is required"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed Customer AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nutrolix-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          gradle -PappRole=customer -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" :app:bundleRelease :app:assembleRelease --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/Nutrolix-Customer-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/Nutrolix-Customer-$VERSION_NAME.apk"
          test -s "artifacts/Nutrolix-Customer-$VERSION_NAME.aab"
          test -s "artifacts/Nutrolix-Customer-$VERSION_NAME.apk"
          jarsigner -verify "artifacts/Nutrolix-Customer-$VERSION_NAME.aab" >/dev/null
          apksigner verify --verbose "artifacts/Nutrolix-Customer-$VERSION_NAME.apk"
          echo "Verified signed Customer AAB and APK for package com.aistudio.nutrolix.fooddelivery"

      - name: Upload signed AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrolix-Customer-Release-AAB-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
