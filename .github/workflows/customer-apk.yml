name: Build Nutrolix Customer and Admin Debug APKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/customer-apk.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build Customer debug APK
        run: |
          gradle -PappRole=customer :app:assembleDebug --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Nutrolix-Customer-debug.apk

      - name: Build Admin debug APK
        env:
          ADMIN_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ADMIN_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$ADMIN_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi
          gradle -PappRole=admin :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Nutrolix-Admin-debug.apk
          if [ -n "$ADMIN_GOOGLE_SERVICES_JSON_BASE64" ]; then
            rm -f app/google-services.json
          fi

      - name: Verify APK artifacts
        run: |
          test -s artifacts/Nutrolix-Customer-debug.apk
          test -s artifacts/Nutrolix-Admin-debug.apk
          ls -lh artifacts/*.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrolix-Customer-debug-apk
          path: artifacts/Nutrolix-Customer-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrolix-Admin-debug-apk
          path: artifacts/Nutrolix-Admin-debug.apk
          if-no-files-found: error
          retention-days: 14
